services:
  db:
    image: postgres:17-alpine
    container_name: fila-facil-db
    environment:
      POSTGRES_USER: fila
      POSTGRES_PASSWORD: fila
      POSTGRES_DB: fila_facil
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fila -d fila_facil"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: fila-facil-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fila:fila@db:5432/fila_facil?schema=public
      PORT: 3000
      CORS_ORIGIN: "*"
    ports:
      - "3000:3000"
    command: sh -c "npx prisma migrate deploy && node dist/server.js"

volumes:
  pgdata:
